[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "annotex"
version = "1.0.0"
description = "Annotation, video and image tools behind one dashboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6-Essentials>=6.5",
    "pillow>=9.0",
    "openpyxl>=3.0",
    "lxml>=4.9",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
annotex = "annotex.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
ai = ["onnxruntime>=1.17", "numpy"]

[tool.setuptools.packages.find]
include = ["annotex*"]

[tool.setuptools.package-data]
annotex = ["resources/**/*"]
