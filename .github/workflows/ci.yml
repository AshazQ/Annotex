# Every push and pull request: every test suite on Windows, macOS and Linux,
# then a real packaged build of each, run headless to prove it starts.
#
# Annotex is written on one machine and used on others.  The tests cannot
# say anything about a platform they have not run on, and a build that
# finished is not a build that runs - so both happen here, on all three.

name: CI

on:
  push:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install -r requirements.txt onnxruntime numpy onnx

      # Whether a tool fits a small laptop screen depends on the fonts.  Qt's
      # offscreen platform uses the system's fonts on Linux, but on Windows
      # and macOS it has none of the platform's own - the first run measured
      # Video to Images at 1701 px wide offscreen on Windows, and 1064 px with
      # Windows' real fonts.  So there the layout checks are left to the step
      # after, which runs them on the real desktop.
      - name: Every test suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python tests/run_all.py
          else
            python tests/run_all.py --except "workspace & display"
          fi

      - name: Layout, with this platform's own fonts
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'cocoa' }}
          PYTHONIOENCODING: utf-8
        run: python tests/run_all.py "workspace & display"

  package:
    name: Package
    needs: tests
    uses: ./.github/workflows/package.yml
    with:
      tag: ""
